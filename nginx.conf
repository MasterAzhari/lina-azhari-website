server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Pages retired in the switch to IT and digital marketing
    location = /technology.html { return 301 /services.html; }
    location = /insurance.html  { return 301 /; }

    # /index.html duplicates / for search engines. Match the request URI, not the
    # location: the "index" directive rewrites / to /index.html internally, and a
    # location rule would redirect / to itself in a loop.
    if ($request_uri ~ ^/index\.html(\?|$)) { return 301 /; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Pages: always revalidate so visitors get new HTML (and its new ?v= asset links) right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
