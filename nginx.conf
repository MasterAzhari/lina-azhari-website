server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Pages retired in the switch to IT and digital marketing
    location = /technology.html { return 301 /services.html; }
    location = /insurance.html  { return 301 /; }

    # /index.html duplicates / for search engines
    location = /index.html { return 301 /; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
