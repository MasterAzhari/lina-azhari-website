server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pages retired in the switch to IT and digital marketing
    location = /technology.html { return 301 /services.html; }
    location = /insurance.html  { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
    }
}
